name: sync-upstream

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: merge upstream
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/kunkundi/crossdesk.git || true
          git fetch upstream --tags --prune

          git checkout mcp
          git merge --no-edit -m "chore: sync upstream" upstream/mcp
          git push origin mcp --tags
